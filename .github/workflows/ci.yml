name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore --locked-mode --warnaserror

      - name: Restore HTTP compatibility checks
        run: dotnet restore tests/HttpSessionCompatibility/HttpSessionCompatibility.csproj --locked-mode --warnaserror

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Check HTTP compatibility test formatting
        run: dotnet format tests/HttpSessionCompatibility/HttpSessionCompatibility.csproj --verify-no-changes --verbosity quiet

      - name: Build
        run: dotnet build --no-restore --warnaserror

      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: Verify HTTP session compatibility
        run: dotnet run --project tests/HttpSessionCompatibility/HttpSessionCompatibility.csproj --no-restore
